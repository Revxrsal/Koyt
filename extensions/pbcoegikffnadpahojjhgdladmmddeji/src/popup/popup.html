<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>HaramBlur Extension</title>
        <script async defer src="../assets/github-button.js"></script>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="header">
            <!-- <label for="language" class="hidden">Select Language:</label> -->
            <div>
                <select id="language">
                    <!-- options with language and flag -->
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="tr">Türkçe</option>
                    <option value="ur">اردو</option>
                </select>
            </div>
            <h1>HaramBlur</h1>
            <div>
                <label class="switch">
                    <input name="status" type="checkbox" />
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="container" id="container">
            <div class="mb-2 mt-2 ml-2">
                <!-- <h2 id="settings">Settings</h2> -->
                <!-- refresh to see changes -->
                <div
                    class="hidden refresh blue-text"
                    id="refresh-message"
                    style="text-align: center"
                >
                    Refresh the page to see changes.
                </div>
            </div>

            <div class="card mt-3" id="whitelist-container">
                <div class="row space-between">
                    <div>
                        <label for="whitelist" id="whitelist-label"
                            ><span id="website-name">bing.com</span>
                        </label>
                        <p id="whitelist-desc" class="fs-xs">
                            Detection is
                            <span id="whitelist-status-on" class="blue-text">
                                On
                            </span>
                            <span
                                id="whitelist-status-off"
                                class="red-text hidden"
                            >
                                Off
                            </span>
                            for this website
                        </p>
                    </div>
                    <label class="switch small">
                        <input
                            name="whitelist"
                            id="whitelist"
                            type="checkbox"
                        />
                        <span class="slider small"></span>
                    </label>
                </div>
            </div>
            <div class="card mt-3">
                <!-- blurryStart mode setting toggle switch -->
                <div class="mb-2">
                    <div class="row space-between">
                        <label for="blurryStart-mode">
                            <span id="blurryStart"> Blur media on load: </span>
                            <!-- i icon tooltip -->
                            <span class="tooltip">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    height="1em"
                                    viewBox="0 0 512 512"
                                >
                                    <path
                                        fill="#2196f3"
                                        d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"
                                    />
                                </svg>
                                <span class="tooltiptext">
                                    When enabled, all images and videos will be
                                    blurred by default until detection starts.
                                </span>
                            </span>
                        </label>
                        <label class="switch small">
                            <input name="blurryStartMode" type="checkbox" />
                            <span class="slider small"></span>
                        </label>
                    </div>
                </div>

                <hr />
                <!-- blur amount setting slider -->
                <div>
                    <label for="blur-amount" id="blurAmount"
                        >Blur amount:
                        <span id="blur-amount-value">20</span>
                    </label>
                    <div class="row space-between" style="gap: 1rem">
                        <input
                            type="range"
                            id="blur-amount"
                            name="blurAmount"
                            min="10"
                            max="50"
                            value="20"
                            class="form-range"
                            width="50px"
                        />
                        <!-- checkbox for "grayscale?" -->
                        <div class="ml-4">
                            <label
                                class="form-checkbox-label"
                                id="grayscale-label"
                            >
                                <span id="grayscale">Grayscale:</span>
                                <input
                                    type="checkbox"
                                    class="form-checkbox"
                                    name="gray"
                                    id="grayscale-checkbox"
                                />
                            </label>
                        </div>
                    </div>
                </div>

                <hr />
                <!-- <div class="row space-between mb-2 hidden"> // if you see this, you get to try I guess :)
                    <span id="detectionModel" trans="model-label">Detection Model:</span>
                    <select name="detectionModel" class="select-small">
                        <option value="NhgGWcJyLYHMppbSpsfw" trans="model-NhgGWcJyLYHMppbSpsfw">NhgGWcJyLYHMppbSpsfw (Slower)</option>
                        <option value="ZaCqO2E1AKJQZpTEpTwww" trans="model-ZaCqO2E1AKJQZpTEpTwww">ZaCqO2E1AKJQZpTEpTwww (Faster)</option>
                    </select>
                </div> -->
                <div class="row space-between mb-2 hidden" id="model-selection">
                    <span id="detectionModel">Detection Model:</span>
                    <select name="detectionModel" class="select-small">
                        <option value="NhgGWcJyLYHMppbSpsfw">
                            NhgGWcJyLYHMppbSpsfw
                        </option>
                        <option value="qIeFIqvEYJW8RyNGNdUTg">
                            qIeFIqvEYJW8RyNGNdUTg
                        </option>
                        <option value="ZaCqO2E1AKJQZpTEpTwww">
                            ZaCqO2E1AKJQZpTEpTwww
                        </option>
                    </select>
                </div>
                <hr id="model-selection-hr" class="hidden" />
                <div class="mb-1 mt-2">
                    <div class="blur-mode-options">
                        <label id="specificBlur"
                            >Blur Mode:
                            <div class="fs-xs">Expiremental feature</div>
                        </label>
                        <label class="blur-mode-option">
                            <input
                                type="radio"
                                name="specificBlur"
                                value="true"
                            />
                            <img
                                src="../assets/specific-blur.png"
                                alt="Specific Blur"
                            />
                            <div class="fs-xs" id="specificBlur-radio-specific">
                                Specific Blur
                            </div>
                        </label>
                        <label class="blur-mode-option">
                            <input
                                type="radio"
                                name="specificBlur"
                                value="false"
                            />
                            <img
                                src="../assets/whole-blur.png"
                                alt="Whole Blur"
                            />
                            <div class="fs-xs" id="specificBlur-radio-whole">
                                Whole Blur
                            </div>
                        </label>
                    </div>
                </div>
                <hr />
                <!-- strictness slider -->
                <div>
                    <label for="blur-amount" id="strictness"
                        >Strictness:
                        <span id="strictness-value">30%</span>
                    </label>
                    <input
                        type="range"
                        id="strictness"
                        name="strictness"
                        min="0.1"
                        max="1"
                        value="0.5"
                        step="0.1"
                        class="form-range"
                    />
                </div>
                <hr />
                <div class="row space-between mb-2">
                    <label>
                        <span id="facesToBlur">Faces to Blur </span>
                    </label>
                    <div class="options-grid">
                        <label class="form-checkbox-label">
                            <input
                                type="checkbox"
                                class="form-checkbox"
                                name="blurMale"
                                value="male"
                            />
                            <span id="blurMale">Male</span>
                        </label>
                        <label class="form-checkbox-label">
                            <input
                                type="checkbox"
                                class="form-checkbox"
                                name="blurFemale"
                                value="female"
                            />
                            <span id="blurFemale">Female</span>
                        </label>
                    </div>
                </div>
                <hr />
                <div class="row space-between mb-2">
                    <label>
                        <span id="mediaToBlur"> Media to Blur </span>
                    </label>
                    <div class="options-grid">
                        <label class="form-checkbox-label">
                            <input
                                type="checkbox"
                                class="form-checkbox"
                                name="blurImages"
                                value="images"
                            />
                            <span id="blurImages">Images</span>
                        </label>
                        <label class="form-checkbox-label">
                            <input
                                type="checkbox"
                                class="form-checkbox"
                                name="blurVideos"
                                value="videos"
                            />
                            <span id="blurVideos">Videos</span>
                        </label>
                    </div>
                </div>
                <hr />
                <details>
                    <summary class="mb-2" style="cursor: pointer">
                        <span id="additionalSettings">Additional Settings</span>
                    </summary>

                    <div class="row space-between mb-2">
                        <label>
                            <span id="unblurOnHover">Unblur on hover</span>
                        </label>
                        <div class="options-grid">
                            <label class="form-checkbox-label">
                                <input
                                    type="checkbox"
                                    class="form-checkbox"
                                    name="unblurImages"
                                    value="images"
                                />
                                <span id="unblurImages">Images</span>
                            </label>
                            <label class="form-checkbox-label">
                                <input
                                    type="checkbox"
                                    class="form-checkbox"
                                    name="unblurVideos"
                                    value="videos"
                                />
                                <span id="unblurVideos">Videos</span>
                            </label>
                        </div>
                    </div>

                    <hr class="mt-2 mb-2" />

                    <div class="row space-between mb-2">
                        <label for="hideVideoToggle">
                            <span id="hideVideoToggle"
                                >Hide video detection toggle</span
                            >
                        </label>
                        <label class="switch small">
                            <input name="hideVideoToggle" type="checkbox" />
                            <span class="slider small"></span>
                        </label>
                    </div>
                </details>
            </div>
        </div>
        <div class="footer">
            <!-- 3 buttons/links 1- share 2- github 3- support -->

            <div
                class="row mb-2"
                style="
                    justify-content: space-between;
                    gap: 1rem;
                    align-items: center;
                    padding-inline: 1rem;
                "
            >
                <a
                    class="github-button"
                    href="https://github.com/alganzory/HaramBlur"
                    data-size="large"
                    aria-label="Star HaramBlur on GitHub"
                    >Star</a
                >
                <!-- <a href="https://www.buymeacoffee.com/alganzory"><img src="https://img.buymeacoffee.com/button-api/?text=Support the project&emoji=💝&slug=alganzory&button_colour=FFDD00&font_colour=000000&font_family=Poppins&outline_colour=000000&coffee_colour=ffffff" /></a> -->
                <script
                    type="text/javascript"
                    src="../assets/buymeacoffee.min.js"
                    data-name="bmc-button"
                    data-slug="alganzory"
                    data-color="#FFDD00"
                    data-emoji="💝"
                    data-font="Poppins"
                    data-text="Support us"
                    data-outline-color="#000000"
                    data-font-color="#000000"
                    data-coffee-color="#ffffff"
                ></script>
                <div class="row" style="gap: 0.2rem">
                    <a
                        href="https://www.addtoany.com/add_to/facebook?linkurl=https%3A%2F%2Fchrome.google.com%2Fwebstore%2Fdetail%2Fharamblur%2Fpbcoegikffnadpahojjhgdladmmddeji&amp;linkname=Download%20HaramBlur%20Extension"
                        target="_blank"
                        ><img
                            src="https://static.addtoany.com/buttons/facebook.svg"
                            width="24"
                            height="24"
                            style="background-color: royalblue"
                    /></a>
                    <a
                        href="https://www.addtoany.com/add_to/twitter?linkurl=https%3A%2F%2Fchrome.google.com%2Fwebstore%2Fdetail%2Fharamblur%2Fpbcoegikffnadpahojjhgdladmmddeji&amp;linkname=Download%20HaramBlur%20Extension"
                        target="_blank"
                        ><img
                            src="https://static.addtoany.com/buttons/x.svg"
                            width="24"
                            height="24"
                            style="background-color: royalblue"
                    /></a>
                    <a
                        href="https://www.addtoany.com/add_to/reddit?linkurl=https%3A%2F%2Fchrome.google.com%2Fwebstore%2Fdetail%2Fharamblur%2Fpbcoegikffnadpahojjhgdladmmddeji&amp;linkname=Download%20HaramBlur%20Extension"
                        target="_blank"
                        ><img
                            src="https://static.addtoany.com/buttons/reddit.svg"
                            width="24"
                            height="24"
                            style="background-color: royalblue"
                    /></a>
                </div>
            </div>

            <div class="feedback fs-xs">
                <span> We love to hear your feedback through our </span>
                <a
                    href="https://forms.gle/mDDjh44MKRVemWX86"
                    target="_blank"
                    data-trans="form-label"
                    >Form</a
                >
                or
                <a
                    href="mailto:md.alganzory@gmail.com"
                    target="_blank"
                    data-trans="email-label"
                    >Email</a
                >
                ❤️
            </div>
        </div>

        <script src="translations.js"></script>
        <script src="popup.js" type="module"></script>
    </body>
</html>
