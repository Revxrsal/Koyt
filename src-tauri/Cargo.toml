[workspace]
members = ["common"]
exclude = ["message_host"]

[package]
name = "KbYouTube"
version = "0.1.2"
description = "A lightweight application for controlling YouTube via global hotkeys"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
ms-store = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
common = { path = "common" }

serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

clap = { version = "4.5.35", features = ["derive"] }

log = "0.4.22"
tauri = { version = "2.3.1", features = ["protocol-asset", "tray-icon"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-fs = "2.2.1"
tokio = { version = "1.44.1", features = ["full"] }
interprocess = { version = "2.2.3", features = ["tokio"] }
anyhow = "1.0.97"
opener = { version = "0.8.2", features = ["reveal"] }
dirs-next = "2.0.0"
tauri-plugin-log = "2.3.1"
tauri-plugin-autostart = "2.3.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-single-instance = "2.2.3"
tauri-plugin-window-state = "2.2.2"
postcard = { version = "1.1.1", features = ["alloc"] }
font-kit = { version = "0.14.3" }
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.20", features = ["json"] }
tauri-plugin-stronghold = "2"
aes-gcm = "0.11.0-rc.0"
rand = "0.9.1"
sha2 = "0.11.0-rc.0"
once_cell = "1.21.3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
native-dialog = { version = "0.7.0", features = ["windows_dpi_awareness", "windows_visual_styles"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
native-dialog = { version = "0.7.0" }

[target.'cfg(target_os = "linux")'.dependencies]
native-dialog = { version = "0.7.0" }
